name: Generate snake animation

on:
  schedule: # runs at minute 0, every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # THEME NOTE: only 3 built-in palettes exist — github, github-dark,
      # github-light. There's no Catppuccin preset. github-light is used
      # here as the closest match; for exact Catppuccin Latte colors, swap
      # this for 5 comma-separated hex values from catppuccin.com/palette
      # via &color_dots=... and &color_snake=...
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-light

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
