name: Generate trophy card

on:
  schedule: # runs at minute 0, every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # NOTE: this points at a feature branch on a third-party fork, not a
      # tagged release. Verify it still exists before relying on it, and
      # consider pinning to a commit SHA for long-term stability.
      #
      # THEME NOTE: this project has no Catppuccin theme yet (open PR #334
      # on the upstream ryo-ma/github-profile-trophy as of writing, not yet
      # merged). "flat" is used here as the closest neutral, light-compatible
      # substitute. Valid themes: flat, onedark, gruvbox, dracula, monokai,
      # chalk, nord, alduin, darkhub, juicyfresh, buddhism, oldie, radical,
      # onestar, discord, algolia, gitdimmed, tokyonight, matrix,
      # apprentice, dark_dimmed, dark_lover.
      - name: generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: flat
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-background: false
          no-frame: false

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
