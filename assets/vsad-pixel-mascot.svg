<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VSAD pixel mascot">

  <style>
    .bot { animation: float 3.2s ease-in-out infinite; transform-origin: 100px 100px; }
    @keyframes float {
      0%   { transform: translateY(0px); }
      50%  { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .eye { animation: blink 4.5s ease-in-out infinite; transform-origin: center; }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(0.1); }
    }
    .antenna-light { animation: pulse 1.4s ease-in-out infinite; }
    .chest-light { animation: pulse 1.4s ease-in-out infinite; animation-delay: .3s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 1; }
    }
  </style>

  <g class="bot">
