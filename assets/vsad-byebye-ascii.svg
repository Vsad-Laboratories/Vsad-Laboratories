<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="150" fill="#000"/>

  <style>
    .ascii {
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #fff;
    }

    .bye {
      transform-origin: 50% 50%;
      transform-box: fill-box;
      animation: byeBye 4s ease-in-out infinite;
    }

    @keyframes byeBye {
      0% {
        opacity: 0;
        transform: perspective(700px)
                   rotateY(-25deg)
                   scale(0.65)
                   translateY(8px);
      }

      15% {
        opacity: 1;
        transform: perspective(700px)
                   rotateY(12deg)
                   scale(1.08)
                   translateY(-3px);
      }

      28% {
        transform: perspective(700px)
                   rotateY(-5deg)
                   scale(0.98)
                   translateY(0);
      }

      45% {
        transform: perspective(700px)
                   rotateY(0deg)
                   scale(1)
                   translateY(0);
      }

      70% {
        opacity: 1;
        transform: perspective(700px)
                   rotateY(5deg)
                   scale(1)
                   translateY(-2px);
      }

      88% {
        opacity: 0.85;
        transform: perspective(700px)
                   rotateY(-12deg)
                   scale(0.96)
                   translateY(2px);
      }

      100% {
        opacity: 0;
        transform: perspective(700px)
                   rotateY(25deg)
                   scale(0.65)
                   translateY(-8px);
      }
    }
  </style>

  <g class="bye">
    <text x="180" y="30" class="ascii" xml:space="preserve">  ____  _  _ _____   ____  _  _ _____</text>
    <text x="180" y="48" class="ascii" xml:space="preserve"> | __ )| \/ | ____| | __ )| \/ | ____|</text>
    <text x="180" y="66" class="ascii" xml:space="preserve"> |  _ \ \  /|  _|   |  _ \ \  /|  _|</text>
    <text x="180" y="84" class="ascii" xml:space="preserve"> | |_) | | || |___  | |_) | | || |___</text>
    <text x="180" y="102" class="ascii" xml:space="preserve"> |____/  |_||_____| |____/  |_||_____|</text>
  </g>
</svg>
