<svg width="800" height="150" viewBox="0 0 800 150" fill="none" xmlns="http://www.w3.org/2000/svg">

  <style>
    @keyframes pulse-glow-red {
      0%, 100% {
        fill: #EF4444;
        filter:
          drop-shadow(0 0 4px #EF4444)
          drop-shadow(0 0 12px #EF4444);
      }

      50% {
        fill: #3B3E52;
        filter: drop-shadow(0 0 1px #3B3E52);
      }
    }

    .ascii-text-red {
      font-family: "Cascadia Mono", "Fira Code", "Courier New", monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      animation: pulse-glow-red 3s infinite ease-in-out;
    }
  </style>

  <!-- =========================
       BYE
       ========================= -->

  <g class="ascii-text-red">

    <!-- LEFT BYE -->
    <text x="105" y="35" xml:space="preserve">BBBB   Y   Y  EEEEE</text>
    <text x="105" y="53" xml:space="preserve">B   B   Y Y   E</text>
    <text x="105" y="71" xml:space="preserve">BBBB     Y    EEEE</text>
    <text x="105" y="89" xml:space="preserve">B   B    Y    E</text>
    <text x="105" y="107" xml:space="preserve">BBBB     Y    EEEEE</text>


    <!-- RIGHT BYE -->
    <text x="470" y="35" xml:space="preserve">BBBB   Y   Y  EEEEE</text>
    <text x="470" y="53" xml:space="preserve">B   B   Y Y   E</text>
    <text x="470" y="71" xml:space="preserve">BBBB     Y    EEEE</text>
    <text x="470" y="89" xml:space="preserve">B   B    Y    E</text>
    <text x="470" y="107" xml:space="preserve">BBBB     Y    EEEEE</text>

  </g>

</svg>
