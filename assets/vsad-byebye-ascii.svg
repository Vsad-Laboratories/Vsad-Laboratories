<svg width="800" height="150"
     viewBox="0 0 800 150"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Greyish background ONLY -->
  <rect
    width="800"
    height="150"
    fill="#181A1D"
  />

  <style>
    @keyframes pulse-glow-red {
      0%, 100% {
        fill: #EF4444;
        filter: drop-shadow(0 0 4px #EF4444) drop-shadow(0 0 12px #EF4444);
      }
      50% {
        fill: #3B3E52;
        filter: drop-shadow(0 0 1px #3B3E52);
      }
    }
    @keyframes terminal-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .ascii-text-red {
      font-family: "Cascadia Mono", "Fira Code", "Courier New", monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #D1D5DB;
    }

    .bye {
      transform-origin: 50% 50%;
      transform-box: fill-box;
      animation: byeBye 4s ease-in-out infinite;
    }

    @keyframes byeBye {
      0% {
        opacity: 0;
        transform: perspective(700px)
                   rotateY(-25deg)
                   scale(0.65)
                   translateY(8px);
      }

      15% {
        opacity: 1;
        transform: perspective(700px)
                   rotateY(12deg)
                   scale(1.08)
                   translateY(-3px);
      }

      28% {
        transform: perspective(700px)
                   rotateY(-5deg)
                   scale(0.98)
                   translateY(0);
      }

      45% {
        transform: perspective(700px)
                   rotateY(0deg)
                   scale(1)
                   translateY(0);
      }

      70% {
        opacity: 1;
        transform: perspective(700px)
                   rotateY(5deg)
                   scale(1)
                   translateY(-2px);
      }

      88% {
        opacity: 0.85;
        transform: perspective(700px)
                   rotateY(-12deg)
                   scale(0.96)
                   translateY(2px);
      }

      100% {
        opacity: 0;
        transform: perspective(700px)
                   rotateY(25deg)
                   scale(0.65)
                   translateY(-8px);
      }
    }
  </style>

  <!-- Big ASCII BYE BYE! with split X coordinates to completely prevent spacing collapse -->
  <g>
    <!-- LEFT WORD: BYE -->
    <text x="160" y="30" class="ascii-text-red" xml:space="preserve"> ____ __     __ _____ </text>
    <text x="160" y="48" class="ascii-text-red" xml:space="preserve">| __ )\ \   / /| ____|</text>
    <text x="160" y="66" class="ascii-text-red" xml:space="preserve">|  _ \ \ \ / / |  _|  </text>
    <text x="160" y="84" class="ascii-text-red" xml:space="preserve">| |_) | \ V /  | |___ </text>
    <text x="160" y="102" class="ascii-text-red" xml:space="preserve">|____/   \_/   |_____|</text>

    <!-- RIGHT WORD: BYE! -->
    <text x="440" y="30" class="ascii-text-red" xml:space="preserve"> ____ __     __ _____ _ </text>
    <text x="440" y="48" class="ascii-text-red" xml:space="preserve">| __ )\ \   / /| ____| |</text>
    <text x="440" y="66" class="ascii-text-red" xml:space="preserve">|  _ \ \ \ / / |  _| | |</text>
    <text x="440" y="84" class="ascii-text-red" xml:space="preserve">| |_) | \ V /  | |___|_|</text>
    <text x="440" y="102" class="ascii-text-red" xml:space="preserve">|____/   \_/   |_____(_)</text>
  </g>

  <!-- Terminal Logs -->
  <text x="400" y="135" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#E2E8F0" font-weight="bold">🔐 VSAD SECURE MATRIX TERMINATION COMPLETED // BYE BYE! <tspan class="blink-dot" fill="#EF4444">█</tspan></text>
</svg>
