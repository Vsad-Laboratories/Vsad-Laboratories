<svg width="800" height="150" viewBox="0 0 800 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse-glow {
      0%, 100% {
        fill: #8B5CF6;
        filter: drop-shadow(0 0 4px #8B5CF6) drop-shadow(0 0 12px #8B5CF6);
      }
      50% {
        fill: #EF4444;
        filter: drop-shadow(0 0 4px #EF4444) drop-shadow(0 0 12px #EF4444);
      }
    }
    @keyframes transform-3d {
      0% {
        transform: perspective(800px) rotateY(0deg) scale(0.95);
      }
      50% {
        transform: perspective(800px) rotateY(10deg) scale(1);
      }
      100% {
        transform: perspective(800px) rotateY(0deg) scale(0.95);
      }
    }
    .ascii {
      font-family: "Cascadia Mono", "Fira Code", "Courier New", monospace;
      font-size: 11px;
      font-weight: bold;
      animation: pulse-glow 4s infinite ease-in-out;
    }
    .container-3d {
      transform-origin: center;
      animation: transform-3d 6s infinite ease-in-out;
    }
  </style>

  <!-- 3D Animated ASCII Group with separate X coords to completely prevent spacing collapse -->
  <g class="container-3d">
    <!-- LEFT WORD: VSAD -->
    <text x="130" y="35" class="ascii" xml:space="preserve">██╗   ██╗███████╗ █████╗ ██████╗</text>
    <text x="130" y="55" class="ascii" xml:space="preserve">██║   ██║██╔════╝██╔══██╗██╔══██╗</text>
    <text x="130" y="75" class="ascii" xml:space="preserve">██║   ██║███████╗███████║██║  ██║</text>
    <text x="130" y="95" class="ascii" xml:space="preserve">╚██╗ ██╔╝╚════██║██╔══██║██║  ██║</text>
    <text x="130" y="115" class="ascii" xml:space="preserve"> ╚████╔╝ ███████║██║  ██║██████╔╝</text>
    <text x="130" y="135" class="ascii" xml:space="preserve">  ╚═══╝  ╚══════╝╚═╝  ╚═╝╚═════╝</text>

    <!-- RIGHT WORD: LABS -->
    <text x="460" y="35" class="ascii" xml:space="preserve">██╗      █████╗ ██████╗ ███████╗</text>
    <text x="460" y="55" class="ascii" xml:space="preserve">██║     ██╔══██╗██╔══██╗██╔════╝</text>
    <text x="460" y="75" class="ascii" xml:space="preserve">██║     ███████║██████╔╝███████╗</text>
    <text x="460" y="95" class="ascii" xml:space="preserve">██║     ██╔══██║██╔══██╗╚════██║</text>
    <text x="460" y="115" class="ascii" xml:space="preserve">███████╗██║  ██║██████╔╝███████║</text>
    <text x="460" y="135" class="ascii" xml:space="preserve">╚══════╝╚═╝  ╚═╝╚═════╝ ╚══════╝</text>
  </g>
</svg>