<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="150" fill="#000"/>

  <style>
    .ascii {
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #fff;
    }

    .scene {
      transform-origin: 50% 50%;
      transform-box: fill-box;
      animation: rotate3d 6s ease-in-out infinite;
    }

    @keyframes rotate3d {
      0% {
        transform: perspective(800px) rotateY(-35deg) scaleX(0.9);
      }

      50% {
        transform: perspective(800px) rotateY(35deg) scaleX(0.9);
      }

      100% {
        transform: perspective(800px) rotateY(-35deg) scaleX(0.9);
      }
    }
  </style>

  <g class="scene">
    <text x="140" y="30" class="ascii" xml:space="preserve">__     ______   _    ____    _        _    ____  ____</text>
    <text x="140" y="48" class="ascii" xml:space="preserve">\ \   / / ___| / \  |  _ \  | |      / \  | __ )/ ___|</text>
    <text x="140" y="66" class="ascii" xml:space="preserve"> \ \ / /\___ \ / _ \ | | | | | |     / _ \ |  _ \\___ \</text>
    <text x="140" y="84" class="ascii" xml:space="preserve">  \ V /  ___) / ___ \| |_| | | |___ / ___ \| |_) |___) |</text>
    <text x="140" y="102" class="ascii" xml:space="preserve">   \_/  |____/_/   \_\____/  |_____/ _/   \_\____/|____/</text>
  </g>
</svg>
